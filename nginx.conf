worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Include standard MIME types so json, csv, and html are served correctly
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Explicitly define yml, csv, and less-common image types if mime.types is outdated
    types {
        text/yaml yml yaml;
        text/csv  csv;
        image/avif avif;
        image/webp webp;
    }

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
