services:
  docs:
    build:
      context: ..
      dockerfile: docsa/Dockerfile
      # Configure auto-index skip for the Nginx Web Package natively via build arguments:
      args:
        - SKIP_AUTO_INDEX=false
    ports:
      - "127.0.0.1:3001:80"
    volumes:
      - ../docsa/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
